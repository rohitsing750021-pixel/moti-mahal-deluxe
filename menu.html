<section class="menu">

<div class="card">
<h2>Paneer Butter Masala</h2>

<div class="card">

</div>

<div class="card">

</button>
</div>

<div class="card">

<script>
function addToCart(name, price) {

let cart = JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name: name,
price: price
});

localStorage.setItem("cart", JSON.stringify(cart));

alert(name + " added to cart ✅");

}
</script>
